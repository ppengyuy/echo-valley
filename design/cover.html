<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>回音谷 · 封面</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: #313d35;
    background:
      radial-gradient(900px 700px at 78% 18%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%),
      radial-gradient(760px 620px at 14% 88%, rgba(190,214,190,.30), rgba(190,214,190,0) 72%),
      linear-gradient(135deg, #f8faf4 0%, #f1f6ed 45%, #e4ede0 100%);
  }
  .canvas {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: 96px 100px;
    display: flex;
    align-items: center;
    gap: 60px;
  }
  .canvas::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 14px;
    background: linear-gradient(180deg, #5f8269, #a9c3a8);
  }
  .left { width: 860px; flex: none; position: relative; z-index: 2; }
  .kicker {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    letter-spacing: 3px;
    color: #5f8269;
    font-weight: 600;
    margin-bottom: 34px;
  }
  .kicker .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #4e695a;
    box-shadow: 0 0 0 8px rgba(94,130,105,.12);
  }
  h1 {
    margin: 0;
    font-family: "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", serif;
    font-size: 172px;
    font-weight: 700;
    letter-spacing: 14px;
    line-height: 1.06;
    color: #294334;
    text-shadow: 0 10px 30px rgba(56,88,66,.10);
  }
  .subtitle {
    margin-top: 16px;
    font-size: 52px;
    letter-spacing: 10px;
    color: #5f8269;
    font-weight: 400;
  }
  .rule {
    width: 92px; height: 4px; border-radius: 4px;
    background: #a9c3a8;
    margin: 46px 0 38px;
  }
  .desc {
    font-size: 34px;
    line-height: 1.85;
    letter-spacing: 2px;
    color: #5d6b60;
    font-weight: 400;
  }
  .chips { margin-top: 52px; display: flex; gap: 18px; }
  .chip {
    padding: 15px 28px;
    border: 1px solid rgba(95,130,105,.42);
    border-radius: 999px;
    background: rgba(255,255,255,.55);
    color: #41624f;
    font-size: 24px;
    letter-spacing: 2px;
  }
  .right {
    width: 760px;
    height: 860px;
    flex: none;
    border-radius: 52px;
    overflow: hidden;
    box-shadow: 0 36px 80px rgba(54,84,62,.16), 0 2px 0 rgba(255,255,255,.9) inset;
    border: 1px solid rgba(255,255,255,.8);
    position: relative;
    z-index: 1;
  }
  .right svg { display: block; width: 760px; height: 860px; }
</style>
</head>
<body>
<div class="canvas">
  <section class="left">
    <div class="kicker"><span class="dot"></span>知乎黑客松 S3 · AI 陪伴与交互赛道</div>
    <h1>回音谷</h1>
    <div class="subtitle">刘看山陪你</div>
    <div class="rule"></div>
    <div class="desc">山间有路，谷中有回音。<br>把说不出口的情绪留在山谷里，<br>让属于自己的声音，轻轻回到耳边。</div>
    <div class="chips">
      <span class="chip">柔性计划</span>
      <span class="chip">情绪陪伴</span>
      <span class="chip">知乎直答</span>
    </div>
  </section>

  <section class="right">
    <svg viewBox="0 0 760 860" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f8ee"/>
          <stop offset="0.55" stop-color="#e6efe1"/>
          <stop offset="1" stop-color="#d6e4d2"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fffdf2" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#fffdf2" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0.2" y2="1">
          <stop offset="0" stop-color="#e6f0e8"/>
          <stop offset="1" stop-color="#bdd4c4"/>
        </linearGradient>
        <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7f8f2"/>
          <stop offset="1" stop-color="#c8d5c5"/>
        </linearGradient>
      </defs>

      <rect width="760" height="860" fill="url(#sky)"/>
      <circle cx="545" cy="176" r="190" fill="url(#glow)"/>
      <circle cx="545" cy="176" r="62" fill="#fffdf2" opacity="0.92"/>

      <g fill="#ffffff" opacity="0.55">
        <ellipse cx="170" cy="188" rx="94" ry="22"/>
        <ellipse cx="228" cy="172" rx="62" ry="18"/>
        <ellipse cx="612" cy="300" rx="74" ry="17"/>
      </g>

      <path d="M0 430 C120 330 210 360 300 300 C390 240 470 300 560 250 C640 205 710 245 760 220 L760 860 L0 860 Z" fill="#d7e4d5" opacity="0.85"/>
      <path d="M0 520 C110 450 190 470 290 410 C380 356 460 420 550 376 C640 332 710 370 760 340 L760 860 L0 860 Z" fill="#c3d5c1" opacity="0.9"/>
      <path d="M0 620 C120 560 225 585 320 530 C420 472 510 540 600 500 C670 468 720 490 760 470 L760 860 L0 860 Z" fill="#aec5ad"/>

      <path d="M-40 860 C120 760 200 700 300 690 C420 678 470 760 560 790 C640 816 700 812 800 780 L800 900 L-40 900 Z" fill="url(#water)"/>
      <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55" stroke-linecap="round">
        <path d="M40 812 C160 760 250 730 330 728"/>
        <path d="M90 842 C210 800 290 780 370 782"/>
        <path d="M430 830 C520 850 610 844 720 818"/>
      </g>

      <g fill="none" stroke="#7fa48a" stroke-width="2.5" opacity="0.55">
        <ellipse cx="520" cy="790" rx="86" ry="22"/>
        <ellipse cx="520" cy="790" rx="132" ry="34" opacity="0.5"/>
        <ellipse cx="520" cy="790" rx="182" ry="48" opacity="0.28"/>
      </g>

      <g>
        <ellipse cx="520" cy="782" rx="112" ry="26" fill="#9fb99e" opacity="0.35"/>
        <ellipse cx="520" cy="772" rx="104" ry="24" fill="url(#stone)"/>
        <ellipse cx="252" cy="826" rx="62" ry="16" fill="#9fb99e" opacity="0.35"/>
        <ellipse cx="252" cy="819" rx="56" ry="14" fill="url(#stone)"/>
        <ellipse cx="690" cy="836" rx="48" ry="13" fill="#9fb99e" opacity="0.3"/>
        <ellipse cx="690" cy="830" rx="44" ry="11" fill="url(#stone)"/>
      </g>

      <svg x="416" y="450" width="215" height="330" viewBox="6 23 149 195" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g>
          <g fill="#41624f">
            <rect x="60" y="172" width="12" height="30" rx="6"/>
            <rect x="92" y="172" width="12" height="30" rx="6"/>
          </g>
          <path d="M114 158c8-4 14 0 14 6 0 5-6 8-12 7" fill="#fcfbf5" stroke="#41624f" stroke-width="3" stroke-linejoin="round"/>
          <path d="M38 74C36 64 38 54 43 46C46 41 53 41 56 46C61 52 68 56 76 60C84 56 91 52 96 46C99 41 106 41 109 46C114 54 116 64 114 74C121 94 126 114 124 136C122 166 106 186 82 190C58 186 42 166 40 136C38 114 40 94 38 74Z" fill="#fcfbf5" stroke="#41624f" stroke-width="3.2" stroke-linejoin="round"/>
          <g stroke="#41624f" stroke-width="10" stroke-linecap="round">
            <path d="M40 116 33 144"/>
            <path d="M114 116 121 144"/>
          </g>
          <ellipse cx="81" cy="92" rx="14" ry="16" fill="#41624f"/>
          <ellipse cx="58" cy="87" rx="3.4" ry="6.2" fill="#41624f"/>
          <ellipse cx="104" cy="87" rx="3.4" ry="6.2" fill="#41624f"/>
        </g>
      </svg>

      <g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#4e695a">
        <g opacity="0.72">
          <rect x="60" y="120" width="150" height="46" rx="23" fill="#ffffff" opacity="0.72"/>
          <text x="135" y="150" text-anchor="middle">今天不想说话</text>
        </g>
        <g opacity="0.66">
          <rect x="66" y="334" width="126" height="46" rx="23" fill="#ffffff" opacity="0.72"/>
          <text x="129" y="364" text-anchor="middle">我有点累</text>
        </g>
        <g opacity="0.6">
          <rect x="530" y="102" width="150" height="46" rx="23" fill="#ffffff" opacity="0.72"/>
          <text x="605" y="132" text-anchor="middle">再试一次吧</text>
        </g>
      </g>
    </svg>
  </section>
</div>
</body>
</html>
